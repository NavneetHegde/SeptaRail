name: Function Build & Deploy

# Replaces pipeline/Yaml_Files/GetTrainsFunction-azure-build-pipelines.yml.
# Builds and tests the Azure Function, then deploys it to Azure via the Aspire
# AppHost (Bicep under infra/, generated by `aspire publish`).

on:
  push:
    branches:
      - 'release/**'
    paths:
      - 'src/GetTrainsFunction/**'
      - 'src/ServiceDefaults/**'
      - 'AppHost/**'
      - 'infra/**'
      - 'test/GetTrainsFunction.Tests/**'
      - '.github/workflows/function-deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write   # required for Azure OIDC login
  contents: read

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Build Function
        run: dotnet build src/GetTrainsFunction/GetTrainsFunction.csproj -c Release
      - name: Test (with coverage)
        run: >
          dotnet test test/GetTrainsFunction.Tests/GetTrainsFunction.Tests.csproj
          -c Release --collect:"XPlat Code Coverage" --results-directory ./coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ./coverage

  deploy:
    needs: build-test
    runs-on: ubuntu-latest   # has Docker preinstalled — Aspire builds the function container image at deploy
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Aspire CLI
        run: |
          dotnet tool install --global Aspire.Cli --version "13.4.*"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # Deploys the AppHost model (Function + storage + ACA env) to Azure using the
      # generated Bicep. Requires the repo/environment to define AZURE_LOCATION and
      # AZURE_ENV_NAME (Variables) plus the AZURE_* OIDC secrets above.
      - name: Deploy with Aspire
        run: aspire deploy AppHost/AppHost.cs --non-interactive
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
